[pytest]
# Default test run is OFFLINE and deterministic: `pytest -q -m "not live"`.
# The `live` marker flags tests that call real Gemini (need GOOGLE_API_KEY).
markers =
    live: tests that make real Gemini API calls (require GOOGLE_API_KEY); excluded by default
asyncio_mode = auto
testpaths = tests
addopts = -ra
